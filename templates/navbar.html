<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navbar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    background-color: #2c3e50;
    display: flex;
    align-items: center;
    padding: 10px;
}

/* Navbar links */
.navbar a {
    color: white;
    padding: 10px 15px;
    text-decoration: none;
    display: block;
}

/* Dropdown */
.dropdown {
    position: relative;
}

/* Dropdown content */
.dropdown-content {
    display: none;
    position: absolute;
    background-color: #34495e;
    min-width: 160px;
    top: 100%;
    left: 0;
    z-index: 1000;
}

/* Dropdown items */
.dropdown-content a {
    padding: 10px;
}

/* Hover effects */
.dropdown-content a:hover {
    background-color: #1abc9c;
}

.dropdown:hover .dropdown-content {
    display: block;
}

.dropdown:hover > a {
    background-color: #1abc9c;
}

/* Search bar */
.search-box {
    margin-left: auto;
    margin-right: 10px;
}

.search-box input {
    padding: 5px;
}

/* Logout button */
.logout {
    background-color: red;
    padding: 8px 15px;
    border: none;
    color: white;
    cursor: pointer;
}

.logout:hover {
    background-color: darkred;
}
</style>

</head>
<body>

<div class="navbar">

    <!-- Notes Dropdown -->
    <div class="dropdown">
        <a href="#">Notes</a>
        <div class="dropdown-content">
            <a href="#">Add Notes</a>
            <a href="#">Excel Notes</a>
            <a href="#">View File</a>
        </div>
    </div>

    <!-- File Dropdown -->
    <div class="dropdown">
        <a href="#">File</a>
        <div class="dropdown-content">
            <a href="#">Add File</a>
            <a href="#">View File</a>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" placeholder="Search...">
    </div>

    <!-- Logout Button -->
    <button class="logout">Logout</button>

</div> 

</body>
</html>
