<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        form {
            background: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        label {
            font-size: 18px;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            color: #333;
        }

        input[type="file"] {
            margin-bottom: 20px;
            padding: 8px;
            border: 2px dashed #4facfe;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        input[type="file"]:hover {
            background-color: #f0f8ff;
        }

        button {
            background-color: #4facfe;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #007bff;
            transform: scale(1.05);
        }
    </style>

</head>
<body>
    <form action="POST">
        <label>File Upload</label>
        <input type="file" name="upload">
        <button type="submit">Submit</button>
    </form>
</body>
</html>
